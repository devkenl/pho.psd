name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only used to publish failure logs to a ci-logs/* branch

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 37 and build-tools
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list 2>/dev/null | grep -E "^\s*(platforms;android-3[5-9]|build-tools;3[6-9])" | sort -u > ci-logs/00-available.txt || true
          cat ci-logs/00-available.txt
          # Package naming changed with minor SDK releases (e.g. android-37 vs android-37.0); pick what exists.
          PLATFORM=$(awk '{print $1}' ci-logs/00-available.txt | grep -E "^platforms;android-37(\.0)?$" | head -1)
          BUILD_TOOLS=$(awk '{print $1}' ci-logs/00-available.txt | grep -E "^build-tools;36\.0\.0$|^build-tools;3[6-9]\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          echo "Installing: $PLATFORM $BUILD_TOOLS"
          sdkmanager "$PLATFORM" "$BUILD_TOOLS" "platform-tools" 2>&1 | tr '\r' '\n' | grep -v '^\[' | tee ci-logs/01-sdk.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Core unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:engine:test :core:editor:test --stacktrace 2>&1 | tee ci-logs/02-core-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ci-logs/03-assemble.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pho.psd-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/*/build/reports/tests/
            core/*/build/test-results/
          if-no-files-found: ignore

      # Build logs are also published as a git branch on failure, so they can be read
      # from environments that cannot download Actions log archives.
      - name: Publish failure logs to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          cp -r core/*/build/test-results ci-logs/ 2>/dev/null || true
          cd ci-logs
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for run ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs/${GITHUB_RUN_ID}
