name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only used to publish failure logs to a ci-logs/* branch

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform 37 and build-tools
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list 2>/dev/null | grep -E "^\s*(platforms;android-3[5-9]|build-tools;3[6-9])" | sort -u > ci-logs/00-available.txt || true
          cat ci-logs/00-available.txt
          # Package naming changed with minor SDK releases (e.g. android-37 vs android-37.0); pick what exists.
          PLATFORM=$(awk '{print $1}' ci-logs/00-available.txt | grep -E "^platforms;android-37(\.0)?$" | head -1)
          BUILD_TOOLS=$(awk '{print $1}' ci-logs/00-available.txt | grep -E "^build-tools;36\.0\.0$|^build-tools;3[6-9]\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          echo "Installing: $PLATFORM $BUILD_TOOLS"
          sdkmanager "$PLATFORM" "$BUILD_TOOLS" "platform-tools" 2>&1 | tr '\r' '\n' | grep -v '^\[' | tee ci-logs/01-sdk.log

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Core unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:engine:test :core:editor:test --stacktrace 2>&1 | tee ci-logs/02-core-tests.log

      - name: Assemble debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ci-logs/03-assemble.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pho.psd-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/*/build/reports/tests/
            core/*/build/test-results/
          if-no-files-found: ignore

      # Build logs and a short report are published as git branches (ci-logs/latest on
      # every run, ci-logs/<run id> on failure) so they can be read from environments
      # that cannot download Actions log archives or artifacts.
      - name: Build report
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs
          cp -r core/*/build/test-results ci-logs/ 2>/dev/null || true
          {
            echo "run: ${GITHUB_RUN_ID}  sha: ${GITHUB_SHA}  status-at-report: ${{ job.status }}"
            find core -path '*/test-results/*' -name 'TEST-*.xml' -print0 2>/dev/null \
              | xargs -0 -r grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
              | awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {printf "unit tests: %d run, %d skipped, %d failures, %d errors\n", t, s, f, e}'
            for a in app/build/outputs/apk/debug/*.apk; do [ -f "$a" ] && echo "apk: $(basename "$a") $(stat -c %s "$a") bytes"; done
            echo "kotlin warnings: $(cat ci-logs/*.log 2>/dev/null | grep -c '^w: ' || true)"
            cat ci-logs/*.log 2>/dev/null | grep '^w: ' | sed "s|$GITHUB_WORKSPACE/||" | sort -u || true
          } > ci-logs/REPORT.txt
          cat ci-logs/REPORT.txt
          echo "::notice title=Build report::$(head -3 ci-logs/REPORT.txt | tr '\n' ' ')"

      - name: Publish logs
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          cd ci-logs
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for run ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q -f "$REMOTE" HEAD:refs/heads/ci-logs/latest
          if [ "${{ job.status }}" != "success" ]; then git push -q -f "$REMOTE" HEAD:refs/heads/ci-logs/${GITHUB_RUN_ID}; fi
